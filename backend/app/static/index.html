<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PrivacyLens — Personal-Data Discovery & Privacy Evidence Inventory</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%230284c7'><path d='M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z'/></svg>">
  <link rel="stylesheet" href="/static/app.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="brand-header">
      <div class="brand-logo">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      </div>
      <div>
        <div class="brand-title">
          PrivacyLens
          <span class="brand-badge">v1.0</span>
        </div>
        <div class="brand-sub">PII Discovery & Inventory</div>
      </div>
    </div>

    <nav class="nav-menu">
      <div class="nav-heading">Core Workflows</div>
      <button class="nav-item active" data-tab="dashboard" onclick="navigateTo('dashboard')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
        <span>Dashboard</span>
      </button>
      <button class="nav-item" data-tab="datasources" onclick="navigateTo('datasources')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>
        <span>Data Sources</span>
      </button>
      <button class="nav-item" data-tab="scandata" onclick="navigateTo('scandata')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><polyline points="8 11 10 13 14 9"/></svg>
        <span>Scan Data</span>
      </button>
      <button class="nav-item" data-tab="inventory" onclick="navigateTo('inventory')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="16" y2="17"/></svg>
        <span>Evidence Inventory</span>
      </button>
      <button class="nav-item" data-tab="purposeretention" onclick="navigateTo('purposeretention')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 11 14 15 10"/></svg>
        <span>Purpose & Retention</span>
      </button>
      <button class="nav-item" data-tab="evidencegaps" onclick="navigateTo('evidencegaps')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        <span>Evidence Gaps</span>
      </button>
      <button class="nav-item" data-tab="evaluation" onclick="navigateTo('evaluation')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        <span>Evaluation & Accuracy</span>
      </button>
      <button class="nav-item" data-tab="reviewcenter" onclick="navigateTo('reviewcenter')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        <span>Review Center</span>
      </button>
      <button class="nav-item" data-tab="settings" onclick="navigateTo('settings')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/></svg>
        <span>Configurable Rules</span>
      </button>
    </nav>

    <div class="sidebar-footer">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
        <span style="color:#64748b;">Detection Engine</span>
        <span class="status-pill"><span class="status-dot"></span> Active</span>
      </div>
      <div style="font-size:10px; color:#475569;">AIORI PS-019 • Technical Evidence</div>
    </div>
  </aside>

  <!-- Main Content -->
  <div class="main-wrapper">
    <header class="header">
      <div>
        <div style="display:flex; align-items:center; gap:10px;">
          <h2 class="header-title" id="header-title">Dashboard Overview</h2>
          <span style="font-size:11px; background:#fffbeb; color:#92400e; border:1px solid #fde68a; padding:2px 8px; border-radius:12px; font-weight:600;">Human Review Required</span>
        </div>
        <p class="header-sub" id="header-sub">Telemetry, discovery metrics, and privacy evidence posture</p>
      </div>

      <div class="btn-group">
        <a href="/api/reports/inventory.csv" download class="btn btn-secondary">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Inventory CSV
        </a>
        <a href="/api/reports/gaps.csv" download class="btn btn-warning">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
          Gaps CSV
        </a>
        <a href="/api/reports/inventory.pdf" target="_blank" class="btn btn-primary">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          Export PDF
        </a>
      </div>
    </header>

    <div class="page-content" id="view-container">
      <!-- Injected by app.js -->
    </div>
  </div>

  <div id="modal-container"></div>
  <script src="/static/app.js"></script>
</body>
</html>
